[tool.poetry]
name = "infrastructure"
version = "0.1.0"
description = "AWS CDK Infrastructure for santi-bank AgentCore Gateway Fine-Grained Access Control demo"
authors = ["Santiago Garcia Arango <san99tiago@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
aws-cdk-lib = "^2.262.0"
constructs = "^10.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
